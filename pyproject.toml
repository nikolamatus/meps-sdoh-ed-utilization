[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meps-sdoh-ed-utilization"
version = "0.1.0"
description = "SDOH-extended MEPS Panel 24 ED-utilization feasibility pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["feasibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
